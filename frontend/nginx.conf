server_tokens off;

# Per-IP limit on the credential endpoints (the backend also rate-limits; this is the outer layer).
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # add_header is not inherited into a location that defines its own, so each location includes this.
    # Add Strict-Transport-Security at the TLS terminator (proxy / load balancer), not here.

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback; index.html must never be cached so deploys take effect.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/ {
        include /etc/nginx/snippets/proxy.conf;
        client_max_body_size 12m;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }
}
